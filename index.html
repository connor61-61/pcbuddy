<title>PCBuddy - Find out what your PC should upgrade next</title>
<meta name="description" content="Enter your CPU, GPU, and RAM to find out what's bottlenecking your PC and get specific upgrade suggestions.">
<meta property="og:title" content="PCBuddy">
<meta property="og:description" content="Find out what your PC should upgrade next.">
<meta property="og:type" content="website">

<style>
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, Segoe UI, sans-serif;
    background: #0f1117;
    color: #e6e6e6;
    display: flex;
    justify-content: center;
    padding: 40px 16px;
    margin: 0;
  }
  .card {
    background: #171a23;
    border: 1px solid #262b38;
    border-radius: 14px;
    padding: 32px;
    max-width: 480px;
    width: 100%;
  }
  h1 { margin-top: 0; font-size: 28px; }
  p.sub { color: #9aa0ac; margin-top: -8px; }
  label { display: block; margin: 16px 0 6px; font-size: 14px; color: #c7cbd4; }
  input, select {
    width: 100%;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid #2f3444;
    background: #0f1117;
    color: #e6e6e6;
    font-size: 15px;
  }
  button {
    margin-top: 24px;
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: #4f7dff;
    color: white;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { background: #3d67e0; }
  #results {
    margin-top: 24px;
    padding-top: 20px;
    border-top: 1px solid #262b38;
    display: none;
  }
  .rec {
    background: #0f1117;
    border: 1px solid #2f3444;
    border-left: 4px solid #4f7dff;
    border-radius: 8px;
    padding: 12px 14px;
    margin-bottom: 10px;
    font-size: 14px;
    line-height: 1.4;
  }
  .rec.priority { border-left-color: #ff6b6b; }
  .rec.good { border-left-color: #3ecf8e; }
  .rec ul { margin: 8px 0 0; padding-left: 18px; }
  .rec li { margin-bottom: 4px; }
  .price { color: #7fd8a3; font-weight: 600; }
</style>
</head>
<body>

<div class="card">
  <h1>PCBuddy</h1>
  <p class="sub">Find out what your PC should upgrade next.</p>

  <label for="cpu">CPU</label>
  <input type="text" id="cpu" list="cpu-list" placeholder="Example: i5-12400F" autocomplete="off">
  <datalist id="cpu-list">
    <option value="i3-10100">
    <option value="i3-12100F">
    <option value="i3-13100">

    <option value="i5-11400F">
    <option value="i5-12400F">
    <option value="i5-12600K">
    <option value="i5-13400F">
    <option value="i5-13600K">
    <option value="i5-14400F">
    <option value="i5-14600K">
    <option value="i7-10700K">
    <option value="i7-11700K">
    <option value="i7-12700K">
    <option value="i7-13700K">
    <option value="i7-14700K">
    <option value="i9-12900K">
    <option value="i9-13900K">
    <option value="i9-14900K">
    <option value="Ryzen 3 3300X">
    <option value="Ryzen 5 3600">
    <option value="Ryzen 5 5600">
    <option value="Ryzen 5 5600X">

    <option value="Ryzen 7 5700X">

    <option value="Ryzen 7 5800X3D">
    <option value="Ryzen 7 7700X">
    <option value="Ryzen 7 7800X3D">

  </datalist>

  <label for="gpu">GPU</label>
  <input type="text" id="gpu" list="gpu-list" placeholder="Example: RTX 2070" autocomplete="off">
  <datalist id="gpu-list">
    <option value="GTX 1050 Ti">
    <option value="GTX 1060">
    <option value="GTX 1070">
    <option value="GTX 1080">
    <option value="GTX 1080 Ti">
    <option value="GTX 1650">
    <option value="GTX 1660">
    <option value="GTX 1660 Super">
    <option value="GTX 1660 Ti">
    <option value="RTX 2060">
    <option value="RTX 2060 Super">
    <option value="RTX 2070">
    <option value="RTX 2070 Super">
    <option value="RTX 2080">
    <option value="RTX 2080 Ti">
    <option value="RTX 3050">
    <option value="RTX 3060">
    <option value="RTX 3060 Ti">
    <option value="RTX 3070">
    <option value="RTX 3070 Ti">
    <option value="RTX 3080">
    <option value="RTX 3080 Ti">
    <option value="RTX 3090">
    <option value="RTX 3090 Ti">
    <option value="RTX 4060">
    <option value="RTX 4060 Ti">
    <option value="RTX 4070">
    <option value="RTX 4070 Super">
    <option value="RTX 4070 Ti">
    <option value="RTX 4070 Ti Super">
    <option value="RTX 4080">
    <option value="RTX 4080 Super">
    <option value="RTX 4090">
    <option value="RX 5600 XT">
    <option value="RX 5700 XT">
    <option value="RX 6600">
    <option value="RX 6600 XT">
    <option value="RX 6650 XT">
    <option value="RX 6700 XT">
    <option value="RX 6750 XT">
    <option value="RX 6800">
    <option value="RX 6800 XT">
    <option value="RX 6900 XT">
    <option value="RX 6950 XT">
    <option value="RX 7600">
    <option value="RX 7700 XT">
    <option value="RX 7800 XT">
    <option value="RX 7900 GRE">
    <option value="RX 7900 XT">
    <option value="RX 7900 XTX">
  </datalist>

  <label for="ram">RAM</label>
  <select id="ram">
    <option value="8">8GB</option>
    <option value="16" selected>16GB</option>
    <option value="32">32GB</option>
    <option value="64">64GB</option>
  </select>

  <label for="usecase">What do you mainly use it for?</label>
  <select id="usecase">
    <option value="1080p">1080p gaming</option>
    <option value="1440p" selected>1440p gaming</option>
    <option value="4k">4K gaming</option>
    <option value="streaming">Gaming + streaming/recording</option>
    <option value="productivity">Everyday use / productivity</option>
  </select>

  <button onclick="analyzePC()">Analyze My PC</button>

  <div id="results"></div>
</div>

<script>
// Tier scores are hand-calibrated on a shared 1-10 scale based on
// roughly where each part lands in real-world gaming benchmarks, so a
// CPU score of 5 and a GPU score of 5 represent comparable "class" of
// part. This replaces the earlier formula-based scoring, which put
// CPUs and GPUs on two different numeric ranges and made almost every
// pairing look CPU-heavy.

const GPU_TIERS = {
  "GTX 1050 TI": 1.5, "GTX 1650": 1.6, "GTX 1060": 2.0, "GTX 1660": 2.5,
  "GTX 1660 SUPER": 2.7, "GTX 1660 TI": 2.8, "GTX 1070": 2.6, "GTX 1080": 3.0,
  "GTX 1080 TI": 3.5, "RTX 2060": 3.0, "RTX 2060 SUPER": 3.3, "RTX 3050": 2.8,
  "RTX 2070": 3.5, "RTX 2070 SUPER": 3.8, "RTX 2080": 4.0, "RTX 2080 TI": 4.5,
  "RTX 3060": 3.5, "RTX 3060 TI": 4.0, "RTX 4060": 4.0, "RTX 3070": 4.5,
  "RTX 3070 TI": 4.7, "RTX 4060 TI": 4.5, "RTX 3080": 5.5, "RTX 4070": 5.5,
  "RTX 3080 TI": 6.0, "RTX 4070 SUPER": 6.0, "RTX 3090": 6.2, "RTX 3090 TI": 6.4,
  "RTX 4070 TI": 6.5, "RTX 4070 TI SUPER": 7.0, "RTX 4080": 7.5,
  "RTX 4080 SUPER": 7.8, "RTX 4090": 9.5,
  "RX 5600 XT": 2.5, "RX 5700 XT": 3.2, "RX 6600": 3.0, "RX 6600 XT": 3.3,
  "RX 6650 XT": 3.5, "RX 7600": 3.3, "RX 6700 XT": 4.0, "RX 6750 XT": 4.2,
  "RX 7700 XT": 4.6, "RX 6800": 4.8, "RX 7800 XT": 5.3, "RX 6800 XT": 5.2,
  "RX 6900 XT": 5.6, "RX 6950 XT": 5.8, "RX 7900 GRE": 6.0, "RX 7900 XT": 6.8,
  "RX 7900 XTX": 7.5
};

const CPU_TIERS = {
  "I3-10100": 2.0, "I3-12100F": 3.5, "I3-13100": 3.8, "I5-10400F": 3.0,
  "I5-11400F": 3.5, "I5-12400F": 4.5, "I5-13400F": 5.0, "I5-12600K": 5.0,
  "I5-14400F": 5.2, "I5-13600K": 5.8, "I5-14600K": 6.0, "I7-10700K": 4.5,
  "I7-11700K": 5.0, "I7-12700K": 6.2, "I7-13700K": 6.8, "I7-14700K": 7.2,
  "I9-12900K": 6.8, "I9-13900K": 7.5, "I9-14900K": 7.8,
  "RYZEN 3 3300X": 2.8, "RYZEN 5 3600": 3.3, "RYZEN 5 5600": 4.8,
  "RYZEN 5 5600X": 5.0, "RYZEN 5 7600": 5.8, "RYZEN 5 7600X": 6.0,
  "RYZEN 7 5700X": 5.3, "RYZEN 7 5800X": 5.5, "RYZEN 7 5800X3D": 6.3,
  "RYZEN 7 7700X": 6.6, "RYZEN 7 7800X3D": 7.4, "RYZEN 9 5900X": 6.1,
  "RYZEN 9 5950X": 6.4, "RYZEN 9 7900X": 7.0, "RYZEN 9 7950X": 7.3,
  "RYZEN 9 7950X3D": 7.6
};

const GPU_UPGRADES = [
  { minTier: 2.5, name: "GTX 1660 Super", price: "$120-140 used" },
  { minTier: 3.5, name: "RTX 3050", price: "$180-210" },
  { minTier: 4.5, name: "RTX 4060", price: "$280-300" },
  { minTier: 5.5, name: "RX 7700 XT", price: "$380-420" },
  { minTier: 6.5, name: "RTX 4070 Super", price: "$550-600" },
  { minTier: 7.5, name: "RTX 4070 Ti Super", price: "$750-800" },
  { minTier: 9, name: "RTX 4080 Super", price: "$950-1000" }
];

const CPU_UPGRADES = [
  { minTier: 4, name: "i5-12400F", price: "$120-140" },
  { minTier: 5, name: "Ryzen 5 5600", price: "$110-130" },
  { minTier: 6, name: "i5-13600K", price: "$250-280" },
  { minTier: 6.5, name: "Ryzen 7 5800X3D", price: "$220-250" },
  { minTier: 7, name: "i7-13700K", price: "$330-360" },
  { minTier: 7.5, name: "Ryzen 7 7800X3D", price: "$380-420" },
  { minTier: 8, name: "i9-14900K", price: "$500-550" }
];

// Minimum GPU/CPU tier we'd consider "sufficient" for each use case.
const USECASE_REQUIREMENTS = {
  "1080p": { gpu: 3.0, cpu: 3.5, label: "1080p gaming" },
  "1440p": { gpu: 4.5, cpu: 5.0, label: "1440p gaming" },
  "4k": { gpu: 6.5, cpu: 6.0, label: "4K gaming" },
  "streaming": { gpu: 5.0, cpu: 6.5, label: "gaming + streaming/recording" },
  "productivity": { gpu: 2.0, cpu: 4.5, label: "everyday use / productivity" }
};

function suggestUpgrades(currentTier, table) {
  return table
    .filter(u => u.minTier > (currentTier === null ? 0 : currentTier))
    .slice(0, 3);
}

function normalize(str) {
  return str.toUpperCase().replace(/\s+/g, " ").trim();
}

// Exact match first, then fall back to a loose substring match so
// slightly different formatting ("RTX3060" vs "RTX 3060") still hits.
function lookupTier(raw, table) {
  const key = normalize(raw);
  if (table[key] !== undefined) return table[key];

  const compact = key.replace(/[\s-]/g, "");
  for (const tableKey in table) {
    if (tableKey.replace(/[\s-]/g, "") === compact) return table[tableKey];
  }
  for (const tableKey in table) {
    if (compact.includes(tableKey.replace(/[\s-]/g, ""))) return table[tableKey];
  }
  return null;
}

function getGpuTier(raw) { return lookupTier(raw, GPU_TIERS); }
function getCpuTier(raw) { return lookupTier(raw, CPU_TIERS); }

function analyzePC() {
  const cpuInput = document.getElementById("cpu").value.trim();
  const gpuInput = document.getElementById("gpu").value.trim();
  const ram = parseInt(document.getElementById("ram").value, 10);
  const usecase = document.getElementById("usecase").value;

  const results = document.getElementById("results");
  results.innerHTML = "";
  results.style.display = "block";

  const recs = [];
  const cpuTier = cpuInput ? getCpuTier(cpuInput) : null;
  const gpuTier = gpuInput ? getGpuTier(gpuInput) : null;
  const req = USECASE_REQUIREMENTS[usecase];

  // RAM check
  if (ram <= 8) {
    recs.push({ text: "Upgrade RAM to 16GB. 8GB is a real bottleneck for modern games and multitasking, and it's usually the cheapest upgrade you can make.", type: "priority" });
  } else if (ram >= 16 && ram < 32 && gpuTier !== null && gpuTier >= 6.5) {
    recs.push({ text: "With a high-end GPU, bumping RAM to 32GB can help in newer games and heavy multitasking.", type: "" });
  } else {
    recs.push({ text: `${ram}GB of RAM is solid for ${req.label}.`, type: "good" });
  }

  // Bottleneck check (CPU vs GPU relative to each other)
  if (cpuTier !== null && gpuTier !== null) {
    const diff = gpuTier - cpuTier;
    if (diff > 1.5) {
      recs.push({
        text: `Your GPU (${gpuInput}) is noticeably stronger than your CPU (${cpuInput}). The CPU is likely holding back your GPU's performance — a CPU upgrade would give the biggest gains.`,
        type: "priority",
        suggestions: suggestUpgrades(cpuTier, CPU_UPGRADES)
      });
    } else if (diff < -1.5) {
      recs.push({
        text: `Your CPU (${cpuInput}) is noticeably stronger than your GPU (${gpuInput}). The GPU is your main bottleneck for gaming performance — a GPU upgrade would give the biggest gains.`,
        type: "priority",
        suggestions: suggestUpgrades(gpuTier, GPU_UPGRADES)
      });
    } else {
      recs.push({ text: `Your CPU (${cpuInput}) and GPU (${gpuInput}) are reasonably balanced for each other.`, type: "good" });
    }
  } else {
    if (cpuInput && cpuTier === null) recs.push({ text: `Couldn't recognize "${cpuInput}" — try a format like "i5-12400F" or "Ryzen 5 5600X", or pick one from the suggestions.`, type: "" });
    if (gpuInput && gpuTier === null) recs.push({ text: `Couldn't recognize "${gpuInput}" — try a format like "RTX 3060" or "RX 6700 XT", or pick one from the suggestions.`, type: "" });
    if (!cpuInput) recs.push({ text: "Enter a CPU to get a bottleneck analysis.", type: "" });
    if (!gpuInput) recs.push({ text: "Enter a GPU to get a bottleneck analysis.", type: "" });
  }

  // Use-case fit check (V5)
  if (gpuTier !== null || cpuTier !== null) {
    const shortfalls = [];
    if (gpuTier !== null && gpuTier < req.gpu) shortfalls.push("GPU");
    if (cpuTier !== null && cpuTier < req.cpu) shortfalls.push("CPU");

    if (shortfalls.length === 0) {
      recs.push({ text: `Your setup meets what's typically needed for ${req.label}.`, type: "good" });
    } else {
      recs.push({
        text: `For ${req.label}, your ${shortfalls.join(" and ")} ${shortfalls.length > 1 ? "are" : "is"} below what's typically recommended. Consider dropping to a lower resolution/settings, or upgrading the part(s) above.`,
        type: "priority"
      });
    }
  }

  recs.forEach(r => {
    const div = document.createElement("div");
    div.className = "rec" + (r.type ? " " + r.type : "");

    const p = document.createElement("p");
    p.style.margin = "0";
    p.textContent = r.text;
    div.appendChild(p);

    if (r.suggestions && r.suggestions.length > 0) {
      const ul = document.createElement("ul");
      r.suggestions.forEach(s => {
        const li = document.createElement("li");
        li.innerHTML = `${s.name} <span class="price">(${s.price})</span>`;
        ul.appendChild(li);
      });
      div.appendChild(ul);
    }

    results.appendChild(div);
  });
}
</script>

</body>
</html>
