<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PCBuddy</title>
</head>

<body>

    <h1>PCBuddy</h1>
    <p>Find out what your PC should upgrade next.</p>

    <h2>Enter Your PC</h2>

    <label>CPU:</label>
    <input type="text" placeholder="Example: i5-12400F">
    <br><br>

    <label>GPU:</label>
    <input type="text" placeholder="Example: RTX 2070">
    <br><br>

    <label>RAM:</label>
    <select>
        <option>8GB</option>
        <option>16GB</option>
        <option>32GB</option>
        <option>64GB</option>
    </select>

    <br><br>

    <button>Analyze My PC</button>

</body>
</html>
