  label { display: block; margin: 0 0 8px; font-size: 15px; color: #c7cbd4; font-weight: 500; }
  .field { position: relative; }
  input[type="text"], select {
    width: 100%;
    padding: 14px 16px;
    border-radius: 10px;
    border: 1px solid #2f3444;
    background: #0d0f16;
    color: #eaeaf0;
    font-size: 16px;
    outline: none;

    border-color: #4f7dff;
    box-shadow: 0 0 0 3px rgba(79,125,255,0.18);

    position: absolute;
    top: calc(100% + 4px);
    left: 0;
    right: 0;
    background: #161923;
    border: 1px solid #2f3444;
    border-radius: 10px;
    max-height: 260px;
    overflow-y: auto;
    z-index: 20;
    display: none;
    box-shadow: 0 12px 30px rgba(0,0,0,0.4);

  .ac-item {
    padding: 11px 16px;

    font-size: 15px;
    display: flex;
    align-items: center;
    gap: 10px;
    border-bottom: 1px solid #1f2330;
  }
  .ac-item:last-child { border-bottom: none; }
  .ac-item:hover, .ac-item.active { background: #1f2432; }
  .ac-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .preview {
    display: none;
    align-items: center;
    gap: 12px;
    margin-top: 10px;
    padding: 10px 12px;
    background: #0d0f16;
    border: 1px solid #262b3c;
    border-radius: 10px;
    font-size: 14px;
    color: #b6bac4;

  .preview .badge {
    font-size: 12px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 6px;
  }
  button.analyze {
    margin-top: 34px;
    width: 100%;
    padding: 17px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(90deg, #4f7dff, #7e4aff);
    color: white;
    font-size: 17px;
    font-weight: 600;
    cursor: pointer;

    gap: 10px;
    margin-top: 26px;
    color: #9aa0ac;
    font-size: 14px;

  .spinner {
    width: 16px; height: 16px;
    border: 2px solid #2f3444;
    border-top-color: #4f7dff;
    border-radius: 50%;

    background: #0d0f16;
    border: 1px solid #262b3c;
    border-radius: 14px;
    padding: 22px 24px;
    margin-bottom: 22px;

  </div>

    <div>

        <option value="32">32GB</option>
        <option value="64">64GB</option>

    </div>
    <div>
      <label for="mobo">Motherboard socket</label>

        <option value="LGA1200">Intel Z590 / B560 / H510</option>
        <option value="LGA1151">Intel Z390 / B365</option>
        <option value="AM5">AMD X670 / B650</option>
        <option value="AM4">AMD X570 / B550 / B450</option>
      </select>
    </div>
  </div>

  <h2 class="section">Storage &amp; power</h2>
  <div class="grid2">
    <div>
      <label for="storagetype">Storage type</label>
      <select id="storagetype">
        <option value="hdd">Hard drive (HDD) only</option>
        <option value="sata_ssd">SATA SSD</option>
        <option value="nvme_ssd" selected>NVMe SSD</option>
      </select>
    </div>
    <div>
      <label for="storagecap">Storage capacity</label>
      <select id="storagecap">
        <option value="128">128GB</option>
        <option value="256">256GB</option>
        <option value="512" selected>512GB</option>
        <option value="1024">1TB</option>
        <option value="2048">2TB or more</option>
      </select>
    </div>
  </div>

  <div class="grid2" style="margin-top: 20px;">
    <div>
      <label for="psu">Power supply</label>
      <select id="psu">
        <option value="notsure">Not sure</option>
        <option value="450">450W</option>
        <option value="550" selected>550W</option>
        <option value="650">650W</option>
        <option value="750">750W</option>
        <option value="850">850W</option>
        <option value="1000">1000W+</option>
      </select>
    </div>
    <div>
      <label for="cooling">CPU cooler</label>
      <select id="cooling">
        <option value="stock" selected>Stock cooler</option>
        <option value="air">Aftermarket air cooler</option>
        <option value="aio">AIO liquid cooler</option>
      </select>
    </div>
  </div>

  <h2 class="section">Usage</h2>
  <label for="usecase">What do you mainly use it for?</label>
  <select id="usecase">
    <option value="1080p">1080p gaming</option>
    <option value="1440p" selected>1440p gaming</option>
    <option value="4k">4K gaming</option>
    <option value="streaming">Gaming + streaming/recording</option>
    <option value="productivity">Everyday use / productivity</option>
  </select>

  <button class="analyze" onclick="analyzePC()">Analyze My PC</button>

  <div id="loading"><div class="spinner"></div><span>Analyzing your setup...</span></div>
  <div id="results"></div>
</div>
</div>

    if (s.includes("AMD") || s.includes("RYZEN")) return { name: "AMD", color: BRAND_COLORS.amd };

    <g stroke="${color}" stroke-width="1.4">
      <line x1="8" y1="12" x2="4" y2="12"/><line x1="8" y1="17" x2="4" y2="17"/>
      <line x1="22" y1="12" x2="26" y2="12"/><line x1="22" y1="17" x2="26" y2="17"/>
      <line x1="12" y1="8" x2="12" y2="4"/><line x1="17" y1="8" x2="17" y2="4"/>
      <line x1="12" y1="22" x2="12" y2="26"/><line x1="17" y1="22" x2="17" y2="26"/>
    </g>
  </svg>`;
}

function gpuIcon(color) {
  return `<svg width="34" height="30" viewBox="0 0 34 30" fill="none" xmlns="http://www.w3.org/2000/svg">
    <rect x="3" y="6" width="28" height="14" rx="2" stroke="${color}" stroke-width="1.6"/>
    <rect x="3" y="20" width="6" height="4" rx="1" fill="${color}" opacity="0.5"/>
    <circle cx="10" cy="13" r="3.4" stroke="${color}" stroke-width="1.3"/>
    <circle cx="19" cy="13" r="3.4" stroke="${color}" stroke-width="1.3"/>
    <line x1="25" y1="9" x2="29" y2="9" stroke="${color}" stroke-width="1.4"/>
    <line x1="25" y1="17" x2="29" y2="17" stroke="${color}" stroke-width="1.4"/>
  </svg>`;
}

function updatePreview(kind, raw, tier) {
  const el = document.getElementById(kind + "-preview");
  if (!raw || tier === null) { el.classList.remove("show"); el.innerHTML = ""; return; }
  const brand = detectBrand(raw, kind);
  const icon = kind === "cpu" ? chipIcon(brand.color) : gpuIcon(brand.color);
  el.innerHTML = `${icon}<span>${raw}</span><span class="badge" style="background:${brand.color}22;color:${brand.color}">${brand.name}</span>`;
  el.classList.add("show");
}

// ================= Matching =================

function normalize(str) { return str.toUpperCase().replace(/\s+/g, " ").trim(); }

function lookupTier(raw, table) {
  const key = normalize(raw);
  if (table[key] !== undefined) return table[key];
  const compact = key.replace(/[\s-]/g, "");
  for (const tableKey in table) {
    if (tableKey.replace(/[\s-]/g, "") === compact) return table[tableKey];
  }
  for (const tableKey in table) {
    if (compact.includes(tableKey.replace(/[\s-]/g, ""))) return table[tableKey];
  }
  return null;
}

function lookupKey(raw, table) {
  const key = normalize(raw);
  if (table[key] !== undefined) return key;
  const compact = key.replace(/[\s-]/g, "");
  for (const tableKey in table) {
    if (tableKey.replace(/[\s-]/g, "") === compact) return tableKey;
  }
  for (const tableKey in table) {
    if (compact.includes(tableKey.replace(/[\s-]/g, ""))) return tableKey;
  }
  return null;
}

function getGpuTier(raw) { return lookupTier(raw, GPU_TIERS); }
function getCpuTier(raw) { return lookupTier(raw, CPU_TIERS); }

function suggestUpgrades(currentTier, table) {
  return table.filter(u => u.minTier > (currentTier === null ? 0 : currentTier)).slice(0, 3);
}

// Rough wattage estimates, anchored to real-world reference points
// (a 4090 draws around 450W, a low-end card around 75W; a 14900K
// draws around 250W at full boost, a low-end CPU around 65W).
// These are estimates for planning headroom, not exact draw.
function estCpuWatts(tier) {
  if (tier === null) return 90;
  return Math.round(65 + (tier - 2) * 32.4);
}
function estGpuWatts(tier) {
  if (tier === null) return 120;
  return Math.round(75 + (tier - 1.5) * 46.9);
}

// ================= Custom autocomplete =================

function setupAutocomplete(inputId, listId, dataArray, kind, lookupFn) {
  const input = document.getElementById(inputId);
  const list = document.getElementById(listId);
  let activeIndex = -1;

  function render(matches) {
    list.innerHTML = "";
    if (matches.length === 0) { list.classList.remove("open"); return; }
    matches.slice(0, 8).forEach((m) => {
      const brand = detectBrand(m, kind);
      const item = document.createElement("div");
      item.className = "ac-item";
      item.innerHTML = `<span class="ac-dot" style="background:${brand.color}"></span><span>${m}</span>`;
      item.addEventListener("mousedown", (e) => {
        e.preventDefault();
        input.value = m;
        list.classList.remove("open");
        updatePreview(kind, m, lookupFn(m));
      });
      list.appendChild(item);
    });
    activeIndex = -1;
    list.classList.add("open");
  }

  input.addEventListener("input", () => {
    const val = input.value.trim();
    updatePreview(kind, val, lookupFn(val));
    if (!val) { list.classList.remove("open"); return; }
    const q = val.toUpperCase();
    const matches = dataArray.filter(m => m.toUpperCase().includes(q));
    render(matches);
  });

  input.addEventListener("keydown", (e) => {
    const items = list.querySelectorAll(".ac-item");
    if (!list.classList.contains("open") || items.length === 0) return;
    if (e.key === "ArrowDown") { e.preventDefault(); activeIndex = Math.min(activeIndex + 1, items.length - 1); }
    else if (e.key === "ArrowUp") { e.preventDefault(); activeIndex = Math.max(activeIndex - 1, 0); }
    else if (e.key === "Enter") {
      if (activeIndex >= 0) { e.preventDefault(); items[activeIndex].dispatchEvent(new Event("mousedown")); }
      return;
    } else if (e.key === "Escape") { list.classList.remove("open"); return; }
    else return;
    items.forEach((it, i) => it.classList.toggle("active", i === activeIndex));
    items[activeIndex].scrollIntoView({ block: "nearest" });
  });

  input.addEventListener("blur", () => { setTimeout(() => list.classList.remove("open"), 100); });
  input.addEventListener("focus", () => { if (input.value.trim()) input.dispatchEvent(new Event("input")); });
}

setupAutocomplete("cpu", "cpu-ac", CPU_LIST, "cpu", getCpuTier);
setupAutocomplete("gpu", "gpu-ac", GPU_LIST, "gpu", getGpuTier);

// ================= Analyze =================

function analyzePC() {
  const loading = document.getElementById("loading");
  const results = document.getElementById("results");
  results.style.display = "none";
  results.innerHTML = "";
  loading.classList.add("show");

  const inputs = {
    cpuInput: document.getElementById("cpu").value.trim(),
    gpuInput: document.getElementById("gpu").value.trim(),
    ram: parseInt(document.getElementById("ram").value, 10),
    mobo: document.getElementById("mobo").value,
    storageType: document.getElementById("storagetype").value,
    storageCap: parseInt(document.getElementById("storagecap").value, 10),
    psu: document.getElementById("psu").value,
    cooling: document.getElementById("cooling").value,
    usecase: document.getElementById("usecase").value
  };

  setTimeout(() => {
    loading.classList.remove("show");
    renderResults(inputs);
  }, 550);
}

function renderResults(inputs) {
  const { cpuInput, gpuInput, ram, mobo, storageType, storageCap, psu, cooling, usecase } = inputs;
  const results = document.getElementById("results");
  results.style.display = "block";

  const recs = [];
  const cpuTier = cpuInput ? getCpuTier(cpuInput) : null;
  const gpuTier = gpuInput ? getGpuTier(gpuInput) : null;
  const cpuKey = cpuInput ? lookupKey(cpuInput, CPU_TIERS) : null;
  const req = USECASE_REQUIREMENTS[usecase];
  let scorePenalty = 0;
  let scoreBonus = 0;

  // ---- RAM ----
  if (ram <= 8) {
    recs.push({ text: "Upgrade RAM to 16GB. 8GB is a real bottleneck for modern games and multitasking, and it's usually the cheapest upgrade you can make.", type: "priority" });
    scorePenalty += 10;
  } else if (ram >= 16 && ram < 32 && gpuTier !== null && gpuTier >= 6.5) {
    recs.push({ text: "With a high-end GPU, bumping RAM to 32GB can help in newer games and heavy multitasking.", type: "warn" });
  } else {
    recs.push({ text: `${ram}GB of RAM is solid for ${req.label}.`, type: "good" });
    scoreBonus += 4;
  }

  // ---- CPU vs GPU bottleneck ----
  if (cpuTier !== null && gpuTier !== null) {
    const diff = gpuTier - cpuTier;
    if (diff > 1.5) {
      recs.push({
        text: `Your GPU (${gpuInput}) is noticeably stronger than your CPU (${cpuInput}). The CPU is likely holding back your GPU's performance — a CPU upgrade would give the biggest gains.`,
        type: "priority",
        suggestions: suggestUpgrades(cpuTier, CPU_UPGRADES)
      });
      scorePenalty += 8;
    } else if (diff < -1.5) {
      recs.push({
        text: `Your CPU (${cpuInput}) is noticeably stronger than your GPU (${gpuInput}). The GPU is your main bottleneck for gaming performance — a GPU upgrade would give the biggest gains.`,
        type: "priority",
        suggestions: suggestUpgrades(gpuTier, GPU_UPGRADES)
      });
      scorePenalty += 8;
    } else {
      recs.push({ text: `Your CPU (${cpuInput}) and GPU (${gpuInput}) are reasonably balanced for each other.`, type: "good" });
      scoreBonus += 6;
    }
  } else {
    if (cpuInput && cpuTier === null) recs.push({ text: `Couldn't recognize "${cpuInput}" — try picking one from the suggestions as you type.`, type: "" });
    if (gpuInput && gpuTier === null) recs.push({ text: `Couldn't recognize "${gpuInput}" — try picking one from the suggestions as you type.`, type: "" });
    if (!cpuInput) recs.push({ text: "Enter a CPU to get a bottleneck analysis.", type: "" });
    if (!gpuInput) recs.push({ text: "Enter a GPU to get a bottleneck analysis.", type: "" });
  }

  // ---- Use-case fit ----
  if (gpuTier !== null || cpuTier !== null) {
    const shortfalls = [];
    if (gpuTier !== null && gpuTier < req.gpu) shortfalls.push("GPU");
    if (cpuTier !== null && cpuTier < req.cpu) shortfalls.push("CPU");
    if (shortfalls.length === 0) {
      recs.push({ text: `Your setup meets what's typically needed for ${req.label}.`, type: "good" });
      scoreBonus += 4;
    } else {
      recs.push({
        text: `For ${req.label}, your ${shortfalls.join(" and ")} ${shortfalls.length > 1 ? "are" : "is"} below what's typically recommended. Consider dropping to a lower resolution/settings, or upgrading the part(s) above.`,
        type: "warn"
      });
      scorePenalty += 6;
    }
  }

  // ---- Motherboard compatibility ----
  if (mobo !== "notsure" && cpuKey) {
    const cpuSocket = CPU_SOCKETS[cpuKey];
    if (cpuSocket && cpuSocket !== mobo) {
      recs.push({
        text: `Compatibility issue: your CPU (${cpuInput}) uses the ${SOCKET_LABELS[cpuSocket]} socket, but you selected a ${SOCKET_LABELS[mobo]} motherboard. These won't physically fit together — you'd need a ${SOCKET_LABELS[cpuSocket]} board instead.`,
        type: "priority"
      });
      scorePenalty += 15;
    } else if (cpuSocket) {
      recs.push({ text: `Your motherboard socket matches your CPU (${SOCKET_LABELS[cpuSocket]}) — no compatibility issue there.`, type: "good" });
    }
  }

  // ---- Storage ----
  if (storageType === "hdd") {
    recs.push({
      text: "You're running on a hard drive only. Switching to an NVMe SSD is one of the biggest quality-of-life upgrades available — much faster boot times, load times, and general responsiveness.",
      type: "priority",
      suggestions: [{ name: `NVMe SSD (${storageCap >= 1024 ? "1TB" : "500GB"})`, price: storageCap >= 1024 ? "$60-80" : "$35-45" }]
    });
    scorePenalty += 10;
  } else if (storageCap <= 256) {
    recs.push({ text: `${storageCap}GB fills up fast with modern games. Consider adding a second drive or upgrading capacity if you're frequently uninstalling things to make room.`, type: "warn" });
    scorePenalty += 3;
  } else {
    recs.push({ text: `Your ${storageType === "nvme_ssd" ? "NVMe SSD" : "SATA SSD"} setup at ${storageCap >= 1024 ? (storageCap / 1024) + "TB" : storageCap + "GB"} is in good shape.`, type: "good" });
    scoreBonus += 3;
  }

  // ---- Power supply ----
  if (cpuTier !== null || gpuTier !== null) {
    const cpuW = estCpuWatts(cpuTier);
    const gpuW = estGpuWatts(gpuTier);
    const overhead = 90;
    const estimatedDraw = cpuW + gpuW + overhead;
    const recommendedPsu = Math.ceil((estimatedDraw * 1.3) / 50) * 50;

    if (psu === "notsure") {
      recs.push({ text: `Your setup draws roughly ${estimatedDraw}W under load (estimated). Aim for a PSU rated at least ${recommendedPsu}W from a reputable brand for safe headroom.`, type: "" });
    } else {
      const psuW = psu === "1000" ? 1000 : parseInt(psu, 10);
      if (psuW < recommendedPsu) {
        recs.push({
          text: `Your ${psuW}W power supply is cutting it close — your setup draws roughly ${estimatedDraw}W under load (estimated), and you'd want at least ${recommendedPsu}W for safe headroom.`,
          type: "priority",
          suggestions: [{ name: `${recommendedPsu}W 80+ Bronze or better`, price: recommendedPsu >= 850 ? "$90-120" : "$55-75" }]
        });
        scorePenalty += 10;
      } else {
        recs.push({ text: `Your ${psuW}W power supply comfortably covers your estimated ${estimatedDraw}W load.`, type: "good" });
        scoreBonus += 3;
      }
    }
  }

  // ---- Cooling ----
  if (cpuTier !== null && cpuTier >= 6.5 && cooling === "stock") {
    recs.push({
      text: `Your CPU (${cpuInput}) runs hot under load, and a stock cooler will likely cause thermal throttling, especially during longer gaming or rendering sessions. An aftermarket cooler would let it sustain higher clocks.`,
      type: "priority",
      suggestions: [
        { name: "Mid-range air cooler (e.g. tower cooler)", price: "$30-50" },
        { name: "240mm AIO liquid cooler", price: "$70-100" }
      ]
    });
    scorePenalty += 7;
  } else if (cooling !== "stock") {
    recs.push({ text: "Your cooling setup gives you good thermal headroom for sustained performance.", type: "good" });
    scoreBonus += 2;
  } else {
    recs.push({ text: "Stock cooling is fine for your current CPU's power draw.", type: "good" });
  }

  // ---- Overall score ----
  const baseTierScore = ((cpuTier || 0) + (gpuTier || 0)) / 2 * 10;
  let score = Math.round(baseTierScore + scoreBonus - scorePenalty);
  score = Math.max(0, Math.min(100, score));

  let scoreLabel, scoreColor;
  if (score >= 80) { scoreLabel = "Great shape"; scoreColor = "#3ecf8e"; }
  else if (score >= 60) { scoreLabel = "Good, minor upgrades possible"; scoreColor = "#4f7dff"; }
  else if (score >= 40) { scoreLabel = "Needs some upgrades"; scoreColor = "#ffb84f"; }
  else { scoreLabel = "Due for a refresh"; scoreColor = "#ff6b6b"; }

  const scoreCard = document.createElement("div");
  scoreCard.className = "score-card";
  scoreCard.innerHTML = `
    <div class="score-top">
      <span class="score-num" style="color:${scoreColor}">${score}<span style="font-size:16px;color:#7f8595;">/100</span></span>
      <span class="score-label" style="color:${scoreColor}">${scoreLabel}</span>
    </div>
    <div class="score-track"><div class="score-fill" style="width:${score}%;background:${scoreColor}"></div></div>
  `;
  results.appendChild(scoreCard);

  const recWrap = document.createElement("div");
  recWrap.className = "rec-wrap";
  recs.forEach((r, i) => {
    const div = document.createElement("div");
    div.className = "rec" + (r.type ? " " + r.type : "");
    div.style.animationDelay = (0.15 + i * 0.07) + "s";

    const p = document.createElement("p");
    p.style.margin = "0";
    p.textContent = r.text;
    div.appendChild(p);

    if (r.suggestions && r.suggestions.length > 0) {
      const ul = document.createElement("ul");
      r.suggestions.forEach(s => {
        const li = document.createElement("li");
        li.innerHTML = `${s.name} <span class="price">(${s.price})</span>`;
        ul.appendChild(li);
      });
      div.appendChild(ul);
    }

    recWrap.appendChild(div);
  });
  results.appendChild(recWrap);
}
</script>
