<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: system-ui, -apple-system, Segoe UI, sans-serif;
    color: #eaeaf0;
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 56px 20px;
    background:
      radial-gradient(circle at 15% 10%, rgba(79,125,255,0.18), transparent 45%),
      radial-gradient(circle at 85% 90%, rgba(126,74,255,0.16), transparent 45%),
      #0a0c12;
    background-attachment: fixed;
  }
  .wrap { max-width: 720px; width: 100%; }
  .card {
    background: linear-gradient(180deg, #171a26 0%, #12141d 100%);
    border: 1px solid #262b3c;
    border-radius: 18px;
    padding: 44px 48px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.35);
  }
  h1 {
    margin: 0 0 4px;
    font-size: 38px;
    letter-spacing: -0.5px;
    background: linear-gradient(90deg, #8fb3ff, #c6a6ff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    display: inline-block;
  }
  p.sub { color: #9aa0ac; margin: 0 0 32px; font-size: 16px; }
  label { display: block; margin: 22px 0 8px; font-size: 15px; color: #c7cbd4; font-weight: 500; }
  .field { position: relative; }
  input[type="text"], select {
    width: 100%;
    padding: 14px 16px;
    border-radius: 10px;
    border: 1px solid #2f3444;
    background: #0d0f16;
    color: #eaeaf0;
    font-size: 16px;
    outline: none;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  input[type="text"]:focus, select:focus {
    border-color: #4f7dff;
    box-shadow: 0 0 0 3px rgba(79,125,255,0.18);
  }
  .autocomplete-list {
    position: absolute;
    top: calc(100% + 4px);
    left: 0;
    right: 0;
    background: #161923;
    border: 1px solid #2f3444;
    border-radius: 10px;
    max-height: 260px;
    overflow-y: auto;
    z-index: 20;
    display: none;
    box-shadow: 0 12px 30px rgba(0,0,0,0.4);
  }
  .autocomplete-list.open { display: block; }
  .ac-item {
    padding: 11px 16px;
    cursor: pointer;
    font-size: 15px;
    display: flex;
    align-items: center;
    gap: 10px;
    border-bottom: 1px solid #1f2330;
  }
  .ac-item:last-child { border-bottom: none; }
  .ac-item:hover, .ac-item.active { background: #1f2432; }
  .ac-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .preview {
    display: none;
    align-items: center;
    gap: 12px;
    margin-top: 10px;
    padding: 10px 12px;
    background: #0d0f16;
    border: 1px solid #262b3c;
    border-radius: 10px;
    font-size: 14px;
    color: #b6bac4;
  }
  .preview.show { display: flex; }
  .preview .badge {
    font-size: 12px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 6px;
  }
  button.analyze {
    margin-top: 30px;
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(90deg, #4f7dff, #7e4aff);
    color: white;
    font-size: 17px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.12s ease, box-shadow 0.12s ease;
  }
  button.analyze:hover { box-shadow: 0 8px 24px rgba(79,125,255,0.35); transform: translateY(-1px); }
  button.analyze:active { transform: translateY(0); }
  #loading {
    display: none;
    align-items: center;
    gap: 10px;
    margin-top: 26px;
    color: #9aa0ac;
    font-size: 14px;
  }
  #loading.show { display: flex; }
  .spinner {
    width: 16px; height: 16px;
    border: 2px solid #2f3444;
    border-top-color: #4f7dff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #results {
    margin-top: 26px;
    padding-top: 24px;
    border-top: 1px solid #262b3c;
    display: none;
  }
  .rec {
    background: #0d0f16;
    border: 1px solid #2f3444;
    border-left: 4px solid #4f7dff;
    border-radius: 10px;
    padding: 16px 18px;
    margin-bottom: 12px;
    font-size: 15px;
    line-height: 1.55;
    opacity: 0;
    transform: translateY(10px);
    animation: rise 0.4s ease forwards;
  }
  @keyframes rise { to { opacity: 1; transform: translateY(0); } }
  .rec.priority { border-left-color: #ff6b6b; }
  .rec.good { border-left-color: #3ecf8e; }
  .rec ul { margin: 10px 0 0; padding-left: 20px; }
  .rec li { margin-bottom: 5px; }
  .price { color: #7fd8a3; font-weight: 600; }

<body>

<div class="wrap">
<div class="card">
  <h1>PCBuddy</h1>
  <p class="sub">Find out what your PC should upgrade next.</p>

  <label for="cpu">CPU</label>
  <div class="field">
    <input type="text" id="cpu" placeholder="Start typing a CPU, like Intel Core i7 or Ryzen 7" autocomplete="off">
    <div class="autocomplete-list" id="cpu-ac"></div>
  </div>
  <div class="preview" id="cpu-preview"></div>

  <label for="gpu">GPU</label>
  <div class="field">
    <input type="text" id="gpu" placeholder="Start typing a GPU, like NVIDIA RTX or AMD RX" autocomplete="off">
    <div class="autocomplete-list" id="gpu-ac"></div>
  </div>
  <div class="preview" id="gpu-preview"></div>

  <label for="ram">RAM</label>
  <select id="ram">
    <option value="8">8GB</option>
    <option value="16" selected>16GB</option>
    <option value="32">32GB</option>
    <option value="64">64GB</option>
  </select>

  <label for="usecase">What do you mainly use it for?</label>
  <select id="usecase">
    <option value="1080p">1080p gaming</option>
    <option value="1440p" selected>1440p gaming</option>
    <option value="4k">4K gaming</option>
    <option value="streaming">Gaming + streaming/recording</option>
    <option value="productivity">Everyday use / productivity</option>
  </select>

  <button class="analyze" onclick="analyzePC()">Analyze My PC</button>

  <div id="loading"><div class="spinner"></div><span>Analyzing your setup...</span></div>
  <div id="results"></div>
</div>
</div>

<script>
// ---------- Data ----------

// Tier scores are hand-calibrated on a shared 1-10 scale based on
// roughly where each part lands in real-world gaming benchmarks, so a
// CPU score of 5 and a GPU score of 5 represent a comparable "class"
// of part.

const GPU_TIERS = {
  "GTX 1050 TI": 1.5, "GTX 1650": 1.6, "GTX 1060": 2.0, "GTX 1660": 2.5,
  "GTX 1660 SUPER": 2.7, "GTX 1660 TI": 2.8, "GTX 1070": 2.6, "GTX 1080": 3.0,
  "GTX 1080 TI": 3.5, "RTX 2060": 3.0, "RTX 2060 SUPER": 3.3, "RTX 3050": 2.8,
  "RTX 2070": 3.5, "RTX 2070 SUPER": 3.8, "RTX 2080": 4.0, "RTX 2080 TI": 4.5,
  "RTX 3060": 3.5, "RTX 3060 TI": 4.0, "RTX 4060": 4.0, "RTX 3070": 4.5,
  "RTX 3070 TI": 4.7, "RTX 4060 TI": 4.5, "RTX 3080": 5.5, "RTX 4070": 5.5,
  "RTX 3080 TI": 6.0, "RTX 4070 SUPER": 6.0, "RTX 3090": 6.2, "RTX 3090 TI": 6.4,
  "RTX 4070 TI": 6.5, "RTX 4070 TI SUPER": 7.0, "RTX 4080": 7.5,
  "RTX 4080 SUPER": 7.8, "RTX 4090": 9.5,
  "RX 5600 XT": 2.5, "RX 5700 XT": 3.2, "RX 6600": 3.0, "RX 6600 XT": 3.3,
  "RX 6650 XT": 3.5, "RX 7600": 3.3, "RX 6700 XT": 4.0, "RX 6750 XT": 4.2,
  "RX 7700 XT": 4.6, "RX 6800": 4.8, "RX 7800 XT": 5.3, "RX 6800 XT": 5.2,
  "RX 6900 XT": 5.6, "RX 6950 XT": 5.8, "RX 7900 GRE": 6.0, "RX 7900 XT": 6.8,
  "RX 7900 XTX": 7.5
};

const CPU_TIERS = {
  "I3-10100": 2.0, "I3-12100F": 3.5, "I3-13100": 3.8, "I5-10400F": 3.0,
  "I5-11400F": 3.5, "I5-12400F": 4.5, "I5-13400F": 5.0, "I5-12600K": 5.0,
  "I5-14400F": 5.2, "I5-13600K": 5.8, "I5-14600K": 6.0, "I7-10700K": 4.5,
  "I7-11700K": 5.0, "I7-12700K": 6.2, "I7-13700K": 6.8, "I7-14700K": 7.2,
  "I9-12900K": 6.8, "I9-13900K": 7.5, "I9-14900K": 7.8,
  "RYZEN 3 3300X": 2.8, "RYZEN 5 3600": 3.3, "RYZEN 5 5600": 4.8,
  "RYZEN 5 5600X": 5.0, "RYZEN 5 7600": 5.8, "RYZEN 5 7600X": 6.0,
  "RYZEN 7 5700X": 5.3, "RYZEN 7 5800X": 5.5, "RYZEN 7 5800X3D": 6.3,
  "RYZEN 7 7700X": 6.6, "RYZEN 7 7800X3D": 7.4, "RYZEN 9 5900X": 6.1,
  "RYZEN 9 5950X": 6.4, "RYZEN 9 7900X": 7.0, "RYZEN 9 7950X": 7.3,
  "RYZEN 9 7950X3D": 7.6
};

// Display list includes brand prefixes for the autocomplete UI.
// Matching still works because lookupTier() does substring matching
// against the un-prefixed keys above.
const CPU_LIST = [
  "Intel Core i3-10100", "Intel Core i3-12100F", "Intel Core i3-13100",
  "Intel Core i5-10400F", "Intel Core i5-11400F", "Intel Core i5-12400F",
  "Intel Core i5-13400F", "Intel Core i5-12600K", "Intel Core i5-14400F",
  "Intel Core i5-13600K", "Intel Core i5-14600K", "Intel Core i7-10700K",
  "Intel Core i7-11700K", "Intel Core i7-12700K", "Intel Core i7-13700K",
  "Intel Core i7-14700K", "Intel Core i9-12900K", "Intel Core i9-13900K",
  "Intel Core i9-14900K",
  "AMD Ryzen 3 3300X", "AMD Ryzen 5 3600", "AMD Ryzen 5 5600",
  "AMD Ryzen 5 5600X", "AMD Ryzen 5 7600", "AMD Ryzen 5 7600X",
  "AMD Ryzen 7 5700X", "AMD Ryzen 7 5800X", "AMD Ryzen 7 5800X3D",
  "AMD Ryzen 7 7700X", "AMD Ryzen 7 7800X3D", "AMD Ryzen 9 5900X",
  "AMD Ryzen 9 5950X", "AMD Ryzen 9 7900X", "AMD Ryzen 9 7950X",
  "AMD Ryzen 9 7950X3D"
];

const GPU_LIST = [
  "NVIDIA GTX 1050 Ti", "NVIDIA GTX 1650", "NVIDIA GTX 1060", "NVIDIA GTX 1660",
  "NVIDIA GTX 1660 Super", "NVIDIA GTX 1660 Ti", "NVIDIA GTX 1070", "NVIDIA GTX 1080",
  "NVIDIA GTX 1080 Ti", "NVIDIA RTX 2060", "NVIDIA RTX 2060 Super", "NVIDIA RTX 3050",
  "NVIDIA RTX 2070", "NVIDIA RTX 2070 Super", "NVIDIA RTX 2080", "NVIDIA RTX 2080 Ti",
  "NVIDIA RTX 3060", "NVIDIA RTX 3060 Ti", "NVIDIA RTX 4060", "NVIDIA RTX 3070",
  "NVIDIA RTX 3070 Ti", "NVIDIA RTX 4060 Ti", "NVIDIA RTX 3080", "NVIDIA RTX 4070",
  "NVIDIA RTX 3080 Ti", "NVIDIA RTX 4070 Super", "NVIDIA RTX 3090", "NVIDIA RTX 3090 Ti",
  "NVIDIA RTX 4070 Ti", "NVIDIA RTX 4070 Ti Super", "NVIDIA RTX 4080",
  "NVIDIA RTX 4080 Super", "NVIDIA RTX 4090",
  "AMD RX 5600 XT", "AMD RX 5700 XT", "AMD RX 6600", "AMD RX 6600 XT",
  "AMD RX 6650 XT", "AMD RX 7600", "AMD RX 6700 XT", "AMD RX 6750 XT",
  "AMD RX 7700 XT", "AMD RX 6800", "AMD RX 7800 XT", "AMD RX 6800 XT",
  "AMD RX 6900 XT", "AMD RX 6950 XT", "AMD RX 7900 GRE", "AMD RX 7900 XT",
  "AMD RX 7900 XTX"
];

const GPU_UPGRADES = [
  { minTier: 2.5, name: "NVIDIA GTX 1660 Super", price: "$120-140 used" },
  { minTier: 3.5, name: "NVIDIA RTX 3050", price: "$180-210" },
  { minTier: 4.5, name: "NVIDIA RTX 4060", price: "$280-300" },
  { minTier: 5.5, name: "AMD RX 7700 XT", price: "$380-420" },
  { minTier: 6.5, name: "NVIDIA RTX 4070 Super", price: "$550-600" },
  { minTier: 7.5, name: "NVIDIA RTX 4070 Ti Super", price: "$750-800" },
  { minTier: 9, name: "NVIDIA RTX 4080 Super", price: "$950-1000" }
];

const CPU_UPGRADES = [
  { minTier: 4, name: "Intel Core i5-12400F", price: "$120-140" },
  { minTier: 5, name: "AMD Ryzen 5 5600", price: "$110-130" },
  { minTier: 6, name: "Intel Core i5-13600K", price: "$250-280" },
  { minTier: 6.5, name: "AMD Ryzen 7 5800X3D", price: "$220-250" },
  { minTier: 7, name: "Intel Core i7-13700K", price: "$330-360" },
  { minTier: 7.5, name: "AMD Ryzen 7 7800X3D", price: "$380-420" },
  { minTier: 8, name: "Intel Core i9-14900K", price: "$500-550" }
];

const USECASE_REQUIREMENTS = {
  "1080p": { gpu: 3.0, cpu: 3.5, label: "1080p gaming" },
  "1440p": { gpu: 4.5, cpu: 5.0, label: "1440p gaming" },
  "4k": { gpu: 6.5, cpu: 6.0, label: "4K gaming" },
  "streaming": { gpu: 5.0, cpu: 6.5, label: "gaming + streaming/recording" },
  "productivity": { gpu: 2.0, cpu: 4.5, label: "everyday use / productivity" }
};

// ---------- Brand detection + icons ----------

const BRAND_COLORS = {
  intel: "#4f9eff",
  amd_cpu: "#ff6b6b",
  amd_gpu: "#ff6b6b",
  nvidia: "#3ecf8e"
};

function detectBrand(raw, kind) {
  const s = raw.toUpperCase();
  if (kind === "cpu") {
    if (s.includes("AMD") || s.includes("RYZEN")) return { name: "AMD", color: BRAND_COLORS.amd_cpu };
    return { name: "Intel", color: BRAND_COLORS.intel };
  } else {
    if (s.includes("AMD") || s.includes("RX ") || s.startsWith("RX")) return { name: "AMD", color: BRAND_COLORS.amd_gpu };
    return { name: "NVIDIA", color: BRAND_COLORS.nvidia };
  }
}

function chipIcon(color) {
  return `<svg width="30" height="30" viewBox="0 0 30 30" fill="none" xmlns="http://www.w3.org/2000/svg">
    <rect x="8" y="8" width="14" height="14" rx="2" stroke="${color}" stroke-width="1.6"/>
    <rect x="12" y="12" width="6" height="6" rx="1" fill="${color}" opacity="0.5"/>
    <g stroke="${color}" stroke-width="1.4">
      <line x1="8" y1="12" x2="4" y2="12"/><line x1="8" y1="17" x2="4" y2="17"/>
      <line x1="22" y1="12" x2="26" y2="12"/><line x1="22" y1="17" x2="26" y2="17"/>
      <line x1="12" y1="8" x2="12" y2="4"/><line x1="17" y1="8" x2="17" y2="4"/>
      <line x1="12" y1="22" x2="12" y2="26"/><line x1="17" y1="22" x2="17" y2="26"/>
    </g>
  </svg>`;
}

function gpuIcon(color) {
  return `<svg width="34" height="30" viewBox="0 0 34 30" fill="none" xmlns="http://www.w3.org/2000/svg">
    <rect x="3" y="6" width="28" height="14" rx="2" stroke="${color}" stroke-width="1.6"/>
    <rect x="3" y="20" width="6" height="4" rx="1" fill="${color}" opacity="0.5"/>
    <circle cx="10" cy="13" r="3.4" stroke="${color}" stroke-width="1.3"/>
    <circle cx="19" cy="13" r="3.4" stroke="${color}" stroke-width="1.3"/>
    <line x1="25" y1="9" x2="29" y2="9" stroke="${color}" stroke-width="1.4"/>
    <line x1="25" y1="17" x2="29" y2="17" stroke="${color}" stroke-width="1.4"/>
  </svg>`;
}

function updatePreview(kind, raw, tier) {
  const el = document.getElementById(kind + "-preview");
  if (!raw || tier === null) { el.classList.remove("show"); el.innerHTML = ""; return; }
  const brand = detectBrand(raw, kind);
  const icon = kind === "cpu" ? chipIcon(brand.color) : gpuIcon(brand.color);
  el.innerHTML = `${icon}<span>${raw}</span><span class="badge" style="background:${brand.color}22;color:${brand.color}">${brand.name}</span>`;
  el.classList.add("show");
}

// ---------- Matching ----------

function normalize(str) {
  return str.toUpperCase().replace(/\s+/g, " ").trim();
}

function lookupTier(raw, table) {
  const key = normalize(raw);
  if (table[key] !== undefined) return table[key];
  const compact = key.replace(/[\s-]/g, "");
  for (const tableKey in table) {
    if (tableKey.replace(/[\s-]/g, "") === compact) return table[tableKey];
  }
  for (const tableKey in table) {
    if (compact.includes(tableKey.replace(/[\s-]/g, ""))) return table[tableKey];
  }
  return null;
}

function getGpuTier(raw) { return lookupTier(raw, GPU_TIERS); }
function getCpuTier(raw) { return lookupTier(raw, CPU_TIERS); }

function suggestUpgrades(currentTier, table) {
  return table.filter(u => u.minTier > (currentTier === null ? 0 : currentTier)).slice(0, 3);
}

// ---------- Custom autocomplete ----------

function setupAutocomplete(inputId, listId, dataArray, kind, lookupFn) {
  const input = document.getElementById(inputId);
  const list = document.getElementById(listId);
  let activeIndex = -1;

  function render(matches) {
    list.innerHTML = "";
    if (matches.length === 0) { list.classList.remove("open"); return; }
    matches.slice(0, 8).forEach((m, i) => {
      const brand = detectBrand(m, kind);
      const item = document.createElement("div");
      item.className = "ac-item";
      item.innerHTML = `<span class="ac-dot" style="background:${brand.color}"></span><span>${m}</span>`;
      item.addEventListener("mousedown", (e) => {
        e.preventDefault();
        input.value = m;
        list.classList.remove("open");
        updatePreview(kind, m, lookupFn(m));
      });
      list.appendChild(item);
    });
    activeIndex = -1;
    list.classList.add("open");
  }

  input.addEventListener("input", () => {
    const val = input.value.trim();
    updatePreview(kind, val, lookupFn(val));
    if (!val) { list.classList.remove("open"); return; }
    const q = val.toUpperCase();
    const matches = dataArray.filter(m => m.toUpperCase().includes(q));
    render(matches);
  });

  input.addEventListener("keydown", (e) => {
    const items = list.querySelectorAll(".ac-item");
    if (!list.classList.contains("open") || items.length === 0) return;
    if (e.key === "ArrowDown") {
      e.preventDefault();
      activeIndex = Math.min(activeIndex + 1, items.length - 1);
    } else if (e.key === "ArrowUp") {
      e.preventDefault();
      activeIndex = Math.max(activeIndex - 1, 0);
    } else if (e.key === "Enter") {
      if (activeIndex >= 0) {
        e.preventDefault();
        items[activeIndex].dispatchEvent(new Event("mousedown"));
      }
      return;
    } else if (e.key === "Escape") {
      list.classList.remove("open");
      return;
    } else {
      return;
    }
    items.forEach((it, i) => it.classList.toggle("active", i === activeIndex));
    items[activeIndex].scrollIntoView({ block: "nearest" });
  });

  input.addEventListener("blur", () => {
    setTimeout(() => list.classList.remove("open"), 100);
  });

  input.addEventListener("focus", () => {
    if (input.value.trim()) input.dispatchEvent(new Event("input"));
  });
}

setupAutocomplete("cpu", "cpu-ac", CPU_LIST, "cpu", getCpuTier);
setupAutocomplete("gpu", "gpu-ac", GPU_LIST, "gpu", getGpuTier);

// ---------- Analyze ----------

function analyzePC() {
  const cpuInput = document.getElementById("cpu").value.trim();
  const gpuInput = document.getElementById("gpu").value.trim();
  const ram = parseInt(document.getElementById("ram").value, 10);
  const usecase = document.getElementById("usecase").value;

  const loading = document.getElementById("loading");
  const results = document.getElementById("results");
  results.style.display = "none";
  results.innerHTML = "";
  loading.classList.add("show");

  setTimeout(() => {
    loading.classList.remove("show");
    renderResults(cpuInput, gpuInput, ram, usecase);
  }, 550);
}

function renderResults(cpuInput, gpuInput, ram, usecase) {
  const results = document.getElementById("results");
  results.style.display = "block";

  const recs = [];
  const cpuTier = cpuInput ? getCpuTier(cpuInput) : null;
  const gpuTier = gpuInput ? getGpuTier(gpuInput) : null;
  const req = USECASE_REQUIREMENTS[usecase];

  if (ram <= 8) {
    recs.push({ text: "Upgrade RAM to 16GB. 8GB is a real bottleneck for modern games and multitasking, and it's usually the cheapest upgrade you can make.", type: "priority" });
  } else if (ram >= 16 && ram < 32 && gpuTier !== null && gpuTier >= 6.5) {
    recs.push({ text: "With a high-end GPU, bumping RAM to 32GB can help in newer games and heavy multitasking.", type: "" });
  } else {
    recs.push({ text: `${ram}GB of RAM is solid for ${req.label}.`, type: "good" });
  }

  if (cpuTier !== null && gpuTier !== null) {
    const diff = gpuTier - cpuTier;
    if (diff > 1.5) {
      recs.push({
        text: `Your GPU (${gpuInput}) is noticeably stronger than your CPU (${cpuInput}). The CPU is likely holding back your GPU's performance — a CPU upgrade would give the biggest gains.`,
        type: "priority",
        suggestions: suggestUpgrades(cpuTier, CPU_UPGRADES)
      });
    } else if (diff < -1.5) {
      recs.push({
        text: `Your CPU (${cpuInput}) is noticeably stronger than your GPU (${gpuInput}). The GPU is your main bottleneck for gaming performance — a GPU upgrade would give the biggest gains.`,
        type: "priority",
        suggestions: suggestUpgrades(gpuTier, GPU_UPGRADES)
      });
    } else {
      recs.push({ text: `Your CPU (${cpuInput}) and GPU (${gpuInput}) are reasonably balanced for each other.`, type: "good" });
    }
  } else {
    if (cpuInput && cpuTier === null) recs.push({ text: `Couldn't recognize "${cpuInput}" — try picking one from the suggestions as you type.`, type: "" });
    if (gpuInput && gpuTier === null) recs.push({ text: `Couldn't recognize "${gpuInput}" — try picking one from the suggestions as you type.`, type: "" });
    if (!cpuInput) recs.push({ text: "Enter a CPU to get a bottleneck analysis.", type: "" });
    if (!gpuInput) recs.push({ text: "Enter a GPU to get a bottleneck analysis.", type: "" });
  }

  if (gpuTier !== null || cpuTier !== null) {
    const shortfalls = [];
    if (gpuTier !== null && gpuTier < req.gpu) shortfalls.push("GPU");
    if (cpuTier !== null && cpuTier < req.cpu) shortfalls.push("CPU");

    if (shortfalls.length === 0) {
      recs.push({ text: `Your setup meets what's typically needed for ${req.label}.`, type: "good" });
    } else {
      recs.push({
        text: `For ${req.label}, your ${shortfalls.join(" and ")} ${shortfalls.length > 1 ? "are" : "is"} below what's typically recommended. Consider dropping to a lower resolution/settings, or upgrading the part(s) above.`,
        type: "priority"
      });
    }
  }

  recs.forEach((r, i) => {
    const div = document.createElement("div");
    div.className = "rec" + (r.type ? " " + r.type : "");
    div.style.animationDelay = (i * 0.08) + "s";

    const p = document.createElement("p");
    p.style.margin = "0";
    p.textContent = r.text;
    div.appendChild(p);

    if (r.suggestions && r.suggestions.length > 0) {
      const ul = document.createElement("ul");
      r.suggestions.forEach(s => {
        const li = document.createElement("li");
        li.innerHTML = `${s.name} <span class="price">(${s.price})</span>`;
        ul.appendChild(li);
      });
      div.appendChild(ul);
    }

    results.appendChild(div);
  });
}
</script>

</body>
</html>
