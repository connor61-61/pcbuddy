<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PCBuddy</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, Segoe UI, sans-serif;
    background: #0f1117;
    color: #e6e6e6;
    display: flex;
    justify-content: center;
    padding: 40px 16px;
    margin: 0;
  }
  .card {
    background: #171a23;
    border: 1px solid #262b38;
    border-radius: 14px;
    padding: 32px;
    max-width: 480px;
    width: 100%;
  }
  h1 { margin-top: 0; font-size: 28px; }
  p.sub { color: #9aa0ac; margin-top: -8px; }
  label { display: block; margin: 16px 0 6px; font-size: 14px; color: #c7cbd4; }
  input, select {
    width: 100%;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid #2f3444;
    background: #0f1117;
    color: #e6e6e6;
    font-size: 15px;
  }
  button {
    margin-top: 24px;
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: #4f7dff;
    color: white;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { background: #3d67e0; }
  #results {
    margin-top: 24px;
    padding-top: 20px;
    border-top: 1px solid #262b38;
    display: none;
  }
  .rec {
    background: #0f1117;
    border: 1px solid #2f3444;
    border-left: 4px solid #4f7dff;
    border-radius: 8px;
    padding: 12px 14px;
    margin-bottom: 10px;
    font-size: 14px;
    line-height: 1.4;
  }
  .rec.priority { border-left-color: #ff6b6b; }
  .rec.good { border-left-color: #3ecf8e; }
</style>
</head>
<body>

<div class="card">
  <h1>PCBuddy</h1>
  <p class="sub">Find out what your PC should upgrade next.</p>

  <label for="cpu">CPU</label>
  <input type="text" id="cpu" list="cpu-list" placeholder="Example: i5-12400F" autocomplete="off">
  <datalist id="cpu-list">
    <option value="i3-10100">
    <option value="i3-12100F">
    <option value="i3-13100">
    <option value="i5-10400F">
    <option value="i5-11400F">
    <option value="i5-12400F">
    <option value="i5-12600K">
    <option value="i5-13400F">
    <option value="i5-13600K">
    <option value="i5-14400F">
    <option value="i5-14600K">
    <option value="i7-10700K">
    <option value="i7-11700K">
    <option value="i7-12700K">
    <option value="i7-13700K">
    <option value="i7-14700K">
    <option value="i9-12900K">
    <option value="i9-13900K">
    <option value="i9-14900K">
    <option value="Ryzen 3 3300X">
    <option value="Ryzen 5 3600">
    <option value="Ryzen 5 5600">
    <option value="Ryzen 5 5600X">
    <option value="Ryzen 5 7600">
    <option value="Ryzen 5 7600X">
    <option value="Ryzen 7 5700X">
    <option value="Ryzen 7 5800X">
    <option value="Ryzen 7 5800X3D">
    <option value="Ryzen 7 7700X">
    <option value="Ryzen 7 7800X3D">
    <option value="Ryzen 9 5900X">
    <option value="Ryzen 9 5950X">
    <option value="Ryzen 9 7900X">
    <option value="Ryzen 9 7950X">
    <option value="Ryzen 9 7950X3D">
  </datalist>

  <label for="gpu">GPU</label>
  <input type="text" id="gpu" list="gpu-list" placeholder="Example: RTX 2070" autocomplete="off">
  <datalist id="gpu-list">
    <option value="GTX 1050 Ti">
    <option value="GTX 1060">
    <option value="GTX 1070">
    <option value="GTX 1080">
    <option value="GTX 1080 Ti">
    <option value="GTX 1650">
    <option value="GTX 1660">
    <option value="GTX 1660 Super">
    <option value="GTX 1660 Ti">
    <option value="RTX 2060">
    <option value="RTX 2060 Super">
    <option value="RTX 2070">
    <option value="RTX 2070 Super">
    <option value="RTX 2080">
    <option value="RTX 2080 Ti">
    <option value="RTX 3050">
    <option value="RTX 3060">
    <option value="RTX 3060 Ti">
    <option value="RTX 3070">
    <option value="RTX 3070 Ti">
    <option value="RTX 3080">
    <option value="RTX 3080 Ti">
    <option value="RTX 3090">
    <option value="RTX 3090 Ti">
    <option value="RTX 4060">
    <option value="RTX 4060 Ti">
    <option value="RTX 4070">
    <option value="RTX 4070 Super">
    <option value="RTX 4070 Ti">
    <option value="RTX 4070 Ti Super">
    <option value="RTX 4080">
    <option value="RTX 4080 Super">
    <option value="RTX 4090">
    <option value="RX 5600 XT">
    <option value="RX 5700 XT">
    <option value="RX 6600">
    <option value="RX 6600 XT">
    <option value="RX 6650 XT">
    <option value="RX 6700 XT">
    <option value="RX 6750 XT">
    <option value="RX 6800">
    <option value="RX 6800 XT">
    <option value="RX 6900 XT">
    <option value="RX 6950 XT">
    <option value="RX 7600">
    <option value="RX 7700 XT">
    <option value="RX 7800 XT">
    <option value="RX 7900 GRE">
    <option value="RX 7900 XT">
    <option value="RX 7900 XTX">
  </datalist>

  <label for="ram">RAM</label>
  <select id="ram">
    <option value="8">8GB</option>
    <option value="16" selected>16GB</option>
    <option value="32">32GB</option>
    <option value="64">64GB</option>
  </select>

  <button onclick="analyzePC()">Analyze My PC</button>

  <div id="results"></div>
</div>

<script>
function getGpuTier(gpuRaw) {
  const gpu = gpuRaw.toUpperCase();
  const match = gpu.match(/(RTX|GTX|RX)\s*-?\s*(\d{3,4})/);
  if (!match) return null;
  const series = match[1];
  const num = parseInt(match[2], 10);
  const isTi = /TI|SUPER|XT|XTX/.test(gpu);

  let tier = null;
  if (series === "RTX") {
    if (num >= 4080) tier = 10;
    else if (num >= 4070) tier = 8.5;
    else if (num >= 4060) tier = 7;
    else if (num >= 3080) tier = 8;
    else if (num >= 3070) tier = 7;
    else if (num >= 3060) tier = 6;
    else if (num >= 3050) tier = 5;
    else if (num >= 2080) tier = 6;
    else if (num >= 2070) tier = 5.5;
    else if (num >= 2060) tier = 5;
  } else if (series === "GTX") {
    if (num >= 1660) tier = 4;
    else if (num >= 1080) tier = 4.5;
    else if (num >= 1070) tier = 4;
    else if (num >= 1060) tier = 3.5;
    else if (num >= 1050) tier = 2.5;
  } else if (series === "RX") {
    if (num >= 7900) tier = 9;
    else if (num >= 7700) tier = 7.5;
    else if (num >= 7600) tier = 6;
    else if (num >= 6800) tier = 7.5;
    else if (num >= 6700) tier = 6.5;
    else if (num >= 6600) tier = 5.5;
    else if (num >= 5700) tier = 4.5;
    else if (num >= 5600) tier = 4;
  }

  if (tier !== null && isTi) tier += 0.5;
  return tier;
}

function getCpuTier(cpuRaw) {
  const cpu = cpuRaw.toUpperCase().replace(/\s+/g, " ").trim();
  const intel = cpu.match(/I([3579])[\s-]?(\d{4,5})/);
  const ryzen = cpu.match(/RYZEN\s?([3579])\s?(\d{3,4})/);

  if (intel) {
    const family = parseInt(intel[1], 10);
    const num = intel[2];
    const gen = parseInt(num.length === 5 ? num.slice(0, 2) : num.slice(0, 1), 10);
    return family * 2 + Math.min(gen, 14) * 0.4;
  }
  if (ryzen) {
    const family = parseInt(ryzen[1], 10);
    const gen = parseInt(ryzen[2][0], 10);
    return family * 2 + gen * 0.5;
  }
  return null;
}

function analyzePC() {
  const cpuInput = document.getElementById("cpu").value.trim();
  const gpuInput = document.getElementById("gpu").value.trim();
  const ram = parseInt(document.getElementById("ram").value, 10);

  const results = document.getElementById("results");
  results.innerHTML = "";
  results.style.display = "block";

  const recs = [];
  const cpuTier = cpuInput ? getCpuTier(cpuInput) : null;
  const gpuTier = gpuInput ? getGpuTier(gpuInput) : null;

  if (ram <= 8) {
    recs.push({ text: "Upgrade RAM to 16GB. 8GB is a real bottleneck for modern games and multitasking, and it's usually the cheapest upgrade you can make.", type: "priority" });
  } else if (ram >= 16 && ram < 32 && gpuTier !== null && gpuTier >= 7) {
    recs.push({ text: "With a high-end GPU, bumping RAM to 32GB can help in newer games and heavy multitasking.", type: "" });
  } else {
    recs.push({ text: `${ram}GB of RAM is solid for most use cases right now.`, type: "good" });
  }

  if (cpuTier !== null && gpuTier !== null) {
    const diff = gpuTier - cpuTier;
    if (diff > 2) {
      recs.push({ text: `Your GPU (${gpuInput}) looks noticeably stronger than your CPU (${cpuInput}). The CPU is likely holding back your GPU's performance — a CPU upgrade would give the biggest gains.`, type: "priority" });
    } else if (diff < -2) {
      recs.push({ text: `Your CPU (${cpuInput}) looks noticeably stronger than your GPU (${gpuInput}). The GPU is your main bottleneck for gaming performance — a GPU upgrade would give the biggest gains.`, type: "priority" });
    } else {
      recs.push({ text: `Your CPU (${cpuInput}) and GPU (${gpuInput}) look reasonably balanced for each other.`, type: "good" });
    }
  } else {
    if (cpuInput && cpuTier === null) recs.push({ text: `Couldn't recognize "${cpuInput}" — try a format like "i5-12400F" or "Ryzen 5 5600X", or pick one from the suggestions.`, type: "" });
    if (gpuInput && gpuTier === null) recs.push({ text: `Couldn't recognize "${gpuInput}" — try a format like "RTX 3060" or "RX 6700 XT", or pick one from the suggestions.`, type: "" });
    if (!cpuInput) recs.push({ text: "Enter a CPU to get a bottleneck analysis.", type: "" });
    if (!gpuInput) recs.push({ text: "Enter a GPU to get a bottleneck analysis.", type: "" });
  }

  recs.forEach(r => {
    const div = document.createElement("div");
    div.className = "rec" + (r.type ? " " + r.type : "");
    div.textContent = r.text;
    results.appendChild(div);
  });
}
</script>

</body>
</html>
